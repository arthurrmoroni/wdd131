<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A responsive country page about Portugal featuring data, weather information, responsive images, and JavaScript wind chill calculation.">
  <meta name="author" content="Arthur Dias">
  <title>WDD 131 - Portugal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/place.css">
  <script src="scripts/place.js" defer></script>
</head>
<body>
  <header>
    <h1>Portugal</h1>
  </header>

  <main>
    <section class="hero">
      <picture>
        <source srcset="images/portugal-large.webp" media="(min-width: 800px)">
        <img src="images/portugal-small.webp" alt="Illustration of Portugal with ocean, bridge, hills, and city buildings" width="600" height="800">
      </picture>
    </section>

    <section class="card data">
      <h2>Data</h2>
      <dl>
        <div>
          <dt>Area:</dt>
          <dd>92,212 sq km</dd>
        </div>
        <div>
          <dt>Population:</dt>
          <dd>10.4 million</dd>
        </div>
        <div>
          <dt>Capital:</dt>
          <dd>Lisbon</dd>
        </div>
        <div>
          <dt>Languages:</dt>
          <dd>Portuguese</dd>
        </div>
        <div>
          <dt>Currency:</dt>
          <dd>Euro (€)</dd>
        </div>
        <div>
          <dt>Time Zone:</dt>
          <dd>UTC+0 / UTC+1</dd>
        </div>
        <div>
          <dt>Calling Code:</dt>
          <dd>+351</dd>
        </div>
        <div>
          <dt>Internet TLD:</dt>
          <dd>.pt</dd>
        </div>
      </dl>
    </section>

    <section class="card weather">
      <h2>Weather</h2>
      <img class="weather-icon" src="images/partly-cloudy.svg" alt="Partly cloudy weather icon" width="80" height="80">
      <dl>
        <div>
          <dt>Temperature:</dt>
          <dd><span id="temperature">10</span> °C</dd>
        </div>
        <div>
          <dt>Conditions:</dt>
          <dd>Partly Cloudy</dd>
        </div>
        <div>
          <dt>Wind:</dt>
          <dd><span id="windSpeed">8</span> km/h</dd>
        </div>
        <div>
          <dt>Wind Chill:</dt>
          <dd><span id="windChill"></span></dd>
        </div>
      </dl>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Arthur Dias | Portugal</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
