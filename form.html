<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form assignment for WDD 131 using HTML forms, JavaScript, and localStorage.">
  <meta name="author" content="Arthur Dias">
  <title>WDD 131 - Product Review Form</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <label for="productName">Product Name <span class="required">*</span></label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <fieldset>
        <legend>Overall Rating <span class="required">*</span></legend>

        <div class="rating">
          <label for="rating1">
            <span>☆</span>
            <input type="radio" id="rating1" name="rating" value="1" required>
          </label>

          <label for="rating2">
            <span>☆☆</span>
            <input type="radio" id="rating2" name="rating" value="2" required>
          </label>

          <label for="rating3">
            <span>☆☆☆</span>
            <input type="radio" id="rating3" name="rating" value="3" required>
          </label>

          <label for="rating4">
            <span>☆☆☆☆</span>
            <input type="radio" id="rating4" name="rating" value="4" required>
          </label>

          <label for="rating5">
            <span>☆☆☆☆☆</span>
            <input type="radio" id="rating5" name="rating" value="5" required>
          </label>
        </div>
      </fieldset>

      <label for="installDate">Date of Installation <span class="required">*</span></label>
      <input type="date" id="installDate" name="installDate" required>

      <fieldset>
        <legend>Which features did you find useful?</legend>
        <p class="hint">Check all that apply.</p>

        <label for="durability" class="checkbox-label">
          <input type="checkbox" id="durability" name="features" value="durability">
          Durability
        </label>

        <label for="easeOfUse" class="checkbox-label">
          <input type="checkbox" id="easeOfUse" name="features" value="ease-of-use">
          Ease of Use
        </label>

        <label for="performance" class="checkbox-label">
          <input type="checkbox" id="performance" name="features" value="performance">
          Performance
        </label>

        <label for="design" class="checkbox-label">
          <input type="checkbox" id="design" name="features" value="design">
          Design
        </label>
      </fieldset>

      <label for="review">Written Review</label>
      <textarea id="review" name="review" rows="5" placeholder="Write your review here..."></textarea>

      <label for="userName">Your Name</label>
      <input type="text" id="userName" name="userName" placeholder="Your name">

      <input type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Arthur Dias | Portugal</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
